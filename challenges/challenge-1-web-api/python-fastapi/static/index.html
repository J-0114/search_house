  // ── Comments ───────────────────────────────────────────────

  const _loadedComments = {}; // cache: taskId -> comments[]
  const _wsConnections  = {}; // live WS: taskId -> WebSocket

  const WS_BASE = API.replace(/^http/, 'ws');

  function _openCommentWs(id) {
    if (_wsConnections[id]) return;
    const token = getToken();
    if (!token) return;
    const ws = new WebSocket(`${WS_BASE}/ws/tasks/${id}/comments?token=${encodeURIComponent(token)}`);
    ws.onmessage = () => {
      const panel = document.getElementById(`commentsPanel_${id}`);
      if (panel && panel.classList.contains('open')) {
        fetchComments(id);
      } else {
        delete _loadedComments[id]; // invalidate so next open re-fetches
      }
    };
    ws.onclose = () => { delete _wsConnections[id]; };
    ws.onerror = () => { ws.close(); };
    _wsConnections[id] = ws;
  }

  function _closeCommentWs(id) {
    const ws = _wsConnections[id];
    if (ws) { ws.close(); delete _wsConnections[id]; }
  }

  async function preloadCommentCount(id) {
    const res = await fetch(`${API}/tasks/${id}/comments`, { headers: authHeaders() });
    if (!res.ok) return;
    const comments = await res.json();
    _loadedComments[id] = comments;
    const el = document.getElementById(`commentCount_${id}`);
    if (el) el.textContent = comments.length ? `${comments.length} comment${comments.length > 1 ? 's' : ''}` : 'Comments';
  }

  async function preloadAttachmentCount(id) {
    const res = await fetch(`${API}/tasks/${id}/attachments`, { headers: authHeaders() });
    if (!res.ok) return;
    const files = await res.json();
    const el = document.getElementById(`attachCount_${id}`);
    if (el) el.textContent = files.length ? `${files.length} file${files.length > 1 ? 's' : ''}` : 'Files';
  }

  async function toggleComments(id) {
    const panel = document.getElementById(`commentsPanel_${id}`);
    const btn   = document.getElementById(`commentBtn_${id}`);
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
      btn.classList.remove('active');
      _closeCommentWs(id);
      return;
    }
    panel.classList.add('open');
    btn.classList.add('active');
    _openCommentWs(id);
    if (_loadedComments[id]) {
      renderComments(id, _loadedComments[id]);
    } else {
      await fetchComments(id);
    }
  }

  async function fetchComments(id) {
    const list = document.getElementById(`commentList_${id}`);
    list.innerHTML = '<div class="comment-empty">Loading…</div>';
    const res = await fetch(`${API}/tasks/${id}/comments`, { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    const comments = res.ok ? await res.json() : [];
    _loadedComments[id] = comments;
    renderComments(id, comments);
  }

  function renderComments(id, comments) {
    const list    = document.getElementById(`commentList_${id}`);
    const countEl = document.getElementById(`commentCount_${id}`);
    const role    = getRole();
    const email   = getCurrentUserEmail();
    countEl.textContent = comments.length ? `${comments.length} comment${comments.length > 1 ? 's' : ''}` : 'Comments';
    if (!comments.length) {
      list.innerHTML = '<div class="comment-empty">No comments yet.</div>';
      return;
    }
    list.innerHTML = comments.map(c => {
      const canDelete = role === 'admin' || c.author === email;
      const deleteBtn = canDelete ? `
        <button class="btn-delete-comment" title="Delete comment" onclick="deleteComment(${id}, ${c.id})">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </button>` : '';
      return `<div class="comment-item" id="comment_${c.id}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem">
          <div><span class="comment-author">${esc(c.author)}</span><span class="comment-time" title="${c.created_at}">${relativeTime(c.created_at)}</span></div>
          ${deleteBtn}
        </div>
        <div class="comment-body">${esc(c.body)}</div>
      </div>`;
    }).join('');
  }

  async function postComment(id) {
    const input = document.getElementById(`commentInput_${id}`);
    const body  = input.value.trim();
    if (!body) return;
    const res = await fetch(`${API}/tasks/${id}/comments`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ body }),
    });
    if (res.status === 401) { logout(); return; }
    if (res.ok) {
      input.value = '';
      delete _loadedComments[id];
      await fetchComments(id);
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.detail || 'Failed to post comment.', true);
    }
  }

  async function deleteComment(taskId, commentId) {
    const res = await fetch(`${API}/tasks/${taskId}/comments/${commentId}`, {
      method: 'DELETE',
      headers: authHeaders(),
    });
    if (res.status === 401) { logout(); return; }
    if (res.status === 204) {
      delete _loadedComments[taskId];
      await fetchComments(taskId);
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.detail || 'Failed to delete comment.', true);
    }
  }

  // ── Attachments ────────────────────────────────────────────

  function _fmtBytes(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1048576) return `${(n/1024).toFixed(1)} KB`;
    return `${(n/1048576).toFixed(1)} MB`;
  }

  async function toggleAttachments(id) {
    const panel = document.getElementById(`attachmentsPanel_${id}`);
    const btn   = document.getElementById(`attachBtn_${id}`);
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
      btn.classList.remove('active');
      return;
    }
    panel.classList.add('open');
    btn.classList.add('active');
    await fetchAttachments(id);
  }

  async function fetchAttachments(id) {
    const list = document.getElementById(`attachmentList_${id}`);
    list.innerHTML = '<div class="comment-empty">Loading…</div>';
    const res = await fetch(`${API}/tasks/${id}/attachments`, { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    const files = res.ok ? await res.json() : [];
    _renderAttachments(id, files);
  }

  function _renderAttachments(id, files) {
    const list  = document.getElementById(`attachmentList_${id}`);
    const count = document.getElementById(`attachCount_${id}`);
    count.textContent = files.length ? `${files.length} file${files.length > 1 ? 's' : ''}` : 'Files';
    if (!files.length) {
      list.innerHTML = '<div class="comment-empty">No files yet.</div>';
      return;
    }
    const email = getCurrentUserEmail();
    const role  = getRole();
    list.innerHTML = files.map(f => {
      const canDel = role === 'admin' || f.uploaded_by === email;
      const delBtn = canDel ? `<button class="btn-delete-comment" title="Delete file" onclick="deleteAttachment(${id}, ${f.id})"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg></button>` : '';
      return `<div class="attachment-item" id="attach_${f.id}">
        <span class="attachment-name" title="${esc(f.filename)}">${esc(f.filename)}</span>
        <span class="attachment-size">${_fmtBytes(f.size)}</span>
        <button class="btn-download" onclick="downloadAttachment(${id}, ${f.id}, '${esc(f.filename)}')">Download</button>
        ${delBtn}
      </div>`;
    }).join('');
  }

  async function downloadAttachment(taskId, fileId, filename) {
    const res = await fetch(`${API}/tasks/${taskId}/attachments/${fileId}`, { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) { toast('Download failed.', true); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  async function deleteAttachment(taskId, fileId) {
    const res = await fetch(`${API}/tasks/${taskId}/attachments/${fileId}`, {
      method: 'DELETE',
      headers: authHeaders(),
    });
    if (res.status === 401) { logout(); return; }
    if (res.status === 204) {
      toast('File deleted.');
      await fetchAttachments(taskId);
      await preloadAttachmentCount(taskId);
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.detail || 'Failed to delete file.', true);
    }
  }

  async function uploadAttachment(id) {
    const input = document.getElementById(`attachFile_${id}`);
    const btn   = document.getElementById(`attachUploadBtn_${id}`);
    if (!input.files.length) { toast('Select a file first.', true); return; }
    const file = input.files[0];
    if (file.size > 5 * 1024 * 1024) { toast('File exceeds the 5 MB limit.', true); return; }
    const form = new FormData();
    form.append('file', file);
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    const res = await fetch(`${API}/tasks/${id}/attachments`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${getToken()}` },
      body: form,
    });
    btn.disabled = false;
    btn.textContent = 'Upload';
    if (res.status === 401) { logout(); return; }
    if (res.ok) {
      input.value = '';
      toast('File uploaded.');
      await fetchAttachments(id);
      await preloadAttachmentCount(id);
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.detail || 'Upload failed.', true);
    }
  }

  // ── Delete confirmation dialog ──────────────────────────────
  let _deleteResolve = null;

  function showDeleteDialog(id) {
    document.getElementById('deleteDialogId').textContent = `#${id}`;
    const dialog = document.getElementById('deleteDialog');
    dialog.style.display = 'flex';
    return new Promise(resolve => {
      _deleteResolve = resolve;
      document.getElementById('deleteConfirmBtn').onclick = () => { closeDeleteDialog(); resolve(true); };
      document.getElementById('deleteCancelBtn').onclick  = () => { closeDeleteDialog(); resolve(false); };
    });
  }

  function closeDeleteDialog() {
    document.getElementById('deleteDialog').style.display = 'none';
  }

  document.getElementById('deleteDialog').addEventListener('click', e => {
    if (e.target === document.getElementById('deleteDialog')) closeDeleteDialog();
  });

  async function deleteTask(id) {
    const confirmed = await showDeleteDialog(id);
    if (!confirmed) return;
    const res = await fetch(`${API}/tasks/${id}`, {
      method: 'DELETE',
      headers: authHeaders(),
    });
    if (res.status === 401) { logout(); return; }
    if (res.status === 204) {
      toast('Task deleted.');
      load(currentPage);
    } else {
      const err = await res.json().catch(() => ({}));
      toast(err.detail || 'Failed to delete task.', true);
    }
  }

  // ── Boot ─────────────────────────────────────────────────────
  if (getToken()) {
    refreshToken().then(() => {
      hideAuthScreen();
      load(1);
    });
  } else {
    showAuthScreen();
  }
</script>
</body>
</html>
